<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec3713",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221310",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<div class="layout-container flex h-full grow flex-col">
<!-- Navigation -->
<header class="flex items-center justify-between border-b border-primary/10 px-6 py-4 lg:px-20">
<div class="flex items-center gap-3 text-primary">
<div class="size-8 bg-primary/10 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-primary">pets</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-xl font-bold leading-tight tracking-tight">宠灵纪念</h2>
</div>
<button class="flex items-center justify-center rounded-full h-10 w-10 bg-primary/5 hover:bg-primary/10 text-slate-600 dark:text-slate-400 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<main class="flex-1 flex items-center justify-center p-6">
<div class="w-full max-w-[480px] space-y-8">
<!-- Hero Image Area -->
<div class="@container">
<div class="relative w-full aspect-[21/9] rounded-xl overflow-hidden shadow-sm border border-primary/5">
<div class="absolute inset-0 bg-gradient-to-br from-primary/20 to-primary/5"></div>
<img alt="Warm sunlight on a sleeping pet" class="w-full h-full object-cover mix-blend-overlay opacity-80" data-alt="Soft morning sunlight hitting a peaceful sleeping cat" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9yETfaGbrbAFfdrO-J6X301aQe34am0CCEFq2eu1sFi-fXjrjlKCIOOf-NQqhcDrkMQbUIaCMLfIil59zP6ZMZnaA5FHwjYhFOQCnRtJGmRk8wQBlhJzwEzg6aXpS9Bz34ElUhBO8ViXDGGshzrKHLMukJOK2eKHG0nX6few1WyvZ1XGvYivbJD7h4pOP1SmKWRwNjbE96mxakAOdr4NCMvODeASWO-cf78EvPPykczQ9teJSpMRrJu50nMEC9yXP6muhUeJ10H8"/>
<div class="absolute inset-0 flex items-end p-6 bg-gradient-to-t from-background-light/80 dark:from-background-dark/80 to-transparent">
<div>
<h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">欢迎回来</h1>
<p class="text-primary/80 font-medium">在回忆中与爱宠重逢</p>
</div>
</div>
</div>
</div>
<!-- Login Form -->
<form class="space-y-5" onsubmit="event.preventDefault()">
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">邮箱</label>
<div class="relative">
<input class="w-full h-14 px-4 bg-white dark:bg-background-dark/50 border border-primary/10 focus:border-primary focus:ring-1 focus:ring-primary rounded-xl outline-none transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="请输入您的电子邮箱" type="email"/>
</div>
</div>
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">密码</label>
<div class="relative flex items-center">
<input class="w-full h-14 px-4 bg-white dark:bg-background-dark/50 border border-primary/10 focus:border-primary focus:ring-1 focus:ring-primary rounded-xl outline-none transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="请输入密码" type="password"/>
<button class="absolute right-4 text-slate-400 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between px-1">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="rounded border-primary/20 text-primary focus:ring-primary w-4 h-4" type="checkbox"/>
<span class="text-sm text-slate-600 dark:text-slate-400 group-hover:text-slate-900 dark:group-hover:text-slate-200">记住我</span>
</label>
<a class="text-sm font-medium text-primary hover:underline" href="#">忘记密码？</a>
</div>
<button class="w-full h-14 bg-primary hover:bg-primary/90 text-white font-bold rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
<span>登录</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative py-2">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-primary/10"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-background-light dark:bg-background-dark px-4 text-slate-500">或者通过以下方式</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 h-12 rounded-xl border border-primary/10 bg-white dark:bg-background-dark/50 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-sm font-semibold">Google</span>
</button>
<button class="flex items-center justify-center gap-3 h-12 rounded-xl border border-primary/10 bg-white dark:bg-background-dark/50 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.11.8 1.12-.16 2.13-.83 3.69-.73 2.05.13 3.56 1.19 4.34 2.64-4.14 2.14-3.13 7.82.91 9.42-.45 1.25-1.12 2.45-2.05 3.34h0zM12.03 7.25c-.02-3.96 3.23-7.23 7.04-7.25.13 4.09-3.41 7.42-7.04 7.25z"></path>
</svg>
<span class="text-sm font-semibold">Apple</span>
</button>
</div>
<!-- Footer Link -->
<p class="text-center text-slate-600 dark:text-slate-400">
                    还没有账号？ 
                    <a class="text-primary font-bold hover:underline transition-all" href="#">立即注册</a>
</p>
</div>
</main>
<!-- Aesthetic Footer Decor -->
<footer class="py-10 flex flex-col items-center opacity-40">
<div class="flex gap-4 mb-4">
<span class="material-symbols-outlined text-primary/50">favorite</span>
<span class="material-symbols-outlined text-primary/50">cloud</span>
<span class="material-symbols-outlined text-primary/50">auto_awesome</span>
</div>
<p class="text-[10px] tracking-widest uppercase text-primary font-medium">永恒的爱，跨越星辰</p>
</footer>
</div>
</body></html>
